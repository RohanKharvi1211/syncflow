name: Deploy to AWS ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1  # Updated to match your AWS region
  ECR_REPOSITORY_BACKEND: syncflow-backend
  ECR_REPOSITORY_FRONTEND: syncflow-frontend
  ECS_CLUSTER: syncflow-cluster
  ECS_SERVICE_BACKEND: syncflow-backend-service
  ECS_SERVICE_FRONTEND: syncflow-frontend-service
  ECS_TASK_DEFINITION_BACKEND: syncflow-backend-task
  ECS_TASK_DEFINITION_FRONTEND: syncflow-frontend-task

jobs:
  build-and-deploy-backend:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image to Amazon ECR
        id: build-image-backend
        timeout-minutes: 20
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG -f backend/Dockerfile backend/
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download existing task definition
        id: task-def-backend
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_BACKEND }} \
            --query taskDefinition > task-definition-backend.json 2>/dev/null || echo "Task definition does not exist, will create new one"
          if [ ! -s task-definition-backend.json ]; then
            # Create a minimal task definition template if it doesn't exist
            cat > task-definition-backend.json <<EOF
          {
            "family": "${{ env.ECS_TASK_DEFINITION_BACKEND }}",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}",
            "taskRoleArn": "${{ secrets.ECS_TASK_ROLE_ARN }}",
            "containerDefinitions": [
              {
                "name": "backend",
                "image": "${{ steps.build-image-backend.outputs.image }}",
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": 8080,
                    "protocol": "tcp"
                  }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/syncflow-backend",
                    "awslogs-region": "${{ env.AWS_REGION }}",
                    "awslogs-stream-prefix": "ecs"
                  }
                },
                "healthCheck": {
                  "command": ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"],
                  "interval": 30,
                  "timeout": 10,
                  "retries": 3,
                  "startPeriod": 120
                }
              }
            ]
          }
          EOF
          fi

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-backend.json
          container-name: backend
          image: ${{ steps.build-image-backend.outputs.image }}

      - name: Check if ECS service exists
        id: check-service-backend
        run: |
          if aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE_BACKEND }} --region ${{ env.AWS_REGION }} --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "service_exists=true" >> $GITHUB_OUTPUT
          else
            echo "service_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  ECS service ${{ env.ECS_SERVICE_BACKEND }} does not exist. Skipping deployment."
            echo "📝 Please create the service first using: ecs/create-ecs-services.sh"
          fi

      - name: Deploy Amazon ECS task definition
        if: steps.check-service-backend.outputs.service_exists == 'true'
        timeout-minutes: 15
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-def-backend.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_BACKEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Check deployment status (backend)
        if: steps.check-service-backend.outputs.service_exists == 'true'
        timeout-minutes: 2
        run: |
          echo "Checking deployment status..."
          RUNNING=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_BACKEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].runningCount' \
            --output text 2>/dev/null || echo "0")
          
          DESIRED=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_BACKEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].desiredCount' \
            --output text 2>/dev/null || echo "0")
          
          echo "Task Status: Running=$RUNNING, Desired=$DESIRED"
          
          if [ "$RUNNING" == "0" ] && [ "$DESIRED" -gt "0" ]; then
            echo "⚠️  WARNING: No tasks are running but desired count is $DESIRED"
            echo "⚠️  Deployment updated but tasks failed to start. Check CloudWatch logs."
          elif [ "$RUNNING" -gt "0" ]; then
            echo "✓ Tasks are running successfully ($RUNNING/$DESIRED)"
          fi
          
          echo ""
          echo "Service details:"
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_BACKEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Pending:pendingCount}' \
            --output table 2>/dev/null || echo "⚠️  Could not fetch service details"
          
          echo ""
          echo "Recent service events:"
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_BACKEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].events[:5].{Message:message,Time:createdAt}' \
            --output table 2>/dev/null || echo "⚠️  Could not fetch events"
        continue-on-error: true

      - name: Register task definition (if service doesn't exist)
        if: steps.check-service-backend.outputs.service_exists == 'false'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          echo "📦 Registering task definition for future service creation..."
          aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-task-def-backend.outputs.task-definition }} \
            --region ${{ env.AWS_REGION }} || echo "⚠️  Failed to register task definition (non-critical)"

  build-and-deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    environment: production
    needs: build-and-deploy-backend
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push frontend image to Amazon ECR
        id: build-image-frontend
        timeout-minutes: 20
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
            -f frontend/Dockerfile frontend/
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download existing task definition
        id: task-def-frontend
        run: |
          # Verify secrets are set
          if [ -z "${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}" ] || [ -z "${{ secrets.ECS_TASK_ROLE_ARN }}" ]; then
            echo "❌ ERROR: ECS_TASK_EXECUTION_ROLE_ARN or ECS_TASK_ROLE_ARN secrets are not set!"
            echo "   Please set these secrets in GitHub repository settings."
            exit 1
          fi
          
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FRONTEND }} \
            --query taskDefinition > task-definition-frontend.json 2>/dev/null || echo "Task definition does not exist, will create new one"
          if [ ! -s task-definition-frontend.json ]; then
            # Create a minimal task definition template if it doesn't exist
            cat > task-definition-frontend.json <<EOF
          {
            "family": "${{ env.ECS_TASK_DEFINITION_FRONTEND }}",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512",
            "executionRoleArn": "${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}",
            "taskRoleArn": "${{ secrets.ECS_TASK_ROLE_ARN }}",
            "containerDefinitions": [
              {
                "name": "frontend",
                "image": "${{ steps.build-image-frontend.outputs.image }}",
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": 80,
                    "protocol": "tcp"
                  }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/syncflow-frontend",
                    "awslogs-region": "${{ env.AWS_REGION }}",
                    "awslogs-stream-prefix": "ecs"
                  }
                },
                "healthCheck": {
                  "command": ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"],
                  "interval": 30,
                  "timeout": 10,
                  "retries": 3,
                  "startPeriod": 60
                }
              }
            ]
          }
          EOF
          else
            # Update existing task definition with secrets if they're placeholders
            sed -i.bak "s|arn:aws:iam::YOUR_ACCOUNT_ID:role/ecsTaskExecutionRole|${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}|g" task-definition-frontend.json
            sed -i.bak "s|arn:aws:iam::YOUR_ACCOUNT_ID:role/ecsTaskRole|${{ secrets.ECS_TASK_ROLE_ARN }}|g" task-definition-frontend.json
            rm -f task-definition-frontend.json.bak 2>/dev/null || true
          fi

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-frontend.json
          container-name: frontend
          image: ${{ steps.build-image-frontend.outputs.image }}

      - name: Check if ECS service exists
        id: check-service-frontend
        run: |
          if aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE_FRONTEND }} --region ${{ env.AWS_REGION }} --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "service_exists=true" >> $GITHUB_OUTPUT
          else
            echo "service_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  ECS service ${{ env.ECS_SERVICE_FRONTEND }} does not exist. Skipping deployment."
            echo "📝 Please create the service first using: ecs/create-ecs-services.sh"
          fi

      - name: Deploy Amazon ECS task definition
        if: steps.check-service-frontend.outputs.service_exists == 'true'
        timeout-minutes: 10
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-def-frontend.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_FRONTEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Check deployment status (frontend)
        if: steps.check-service-frontend.outputs.service_exists == 'true'
        timeout-minutes: 2
        run: |
          echo "Checking deployment status..."
          RUNNING=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_FRONTEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].runningCount' \
            --output text 2>/dev/null || echo "0")
          
          DESIRED=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_FRONTEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].desiredCount' \
            --output text 2>/dev/null || echo "0")
          
          echo "Task Status: Running=$RUNNING, Desired=$DESIRED"
          
          if [ "$RUNNING" == "0" ] && [ "$DESIRED" -gt "0" ]; then
            echo "⚠️  WARNING: No tasks are running but desired count is $DESIRED"
            echo "⚠️  Deployment updated but tasks failed to start. Check CloudWatch logs."
          elif [ "$RUNNING" -gt "0" ]; then
            echo "✓ Tasks are running successfully ($RUNNING/$DESIRED)"
          fi
          
          echo ""
          echo "Service details:"
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_FRONTEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Pending:pendingCount}' \
            --output table 2>/dev/null || echo "⚠️  Could not fetch service details"
          
          echo ""
          echo "Recent service events:"
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_FRONTEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].events[:5].{Message:message,Time:createdAt}' \
            --output table 2>/dev/null || echo "⚠️  Could not fetch events"
        continue-on-error: true

      - name: Register task definition and create service (if service doesn't exist)
        if: steps.check-service-frontend.outputs.service_exists == 'false'
        continue-on-error: true
        timeout-minutes: 10
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          CLUSTER: ${{ env.ECS_CLUSTER }}
          SERVICE_NAME: ${{ env.ECS_SERVICE_FRONTEND }}
          TASK_DEF_FAMILY: ${{ env.ECS_TASK_DEFINITION_FRONTEND }}
        run: |
          echo "📦 Service doesn't exist. Registering task definition and creating service..."
          
          # Verify rendered task definition exists and has valid role ARNs
          TASK_DEF_FILE="${{ steps.render-task-def-frontend.outputs.task-definition }}"
          if [ ! -f "$TASK_DEF_FILE" ]; then
            echo "❌ Task definition file not found: $TASK_DEF_FILE"
            echo "   Cannot create service without task definition."
            exit 0
          fi
          
          # Check if role ARNs are valid (not placeholders)
          if grep -q "YOUR_ACCOUNT_ID\|YOUR_ECR_REGISTRY" "$TASK_DEF_FILE"; then
            echo "❌ Task definition contains placeholder values. Secrets may not be set."
            echo "   ExecutionRoleArn and TaskRoleArn must be valid ARNs."
            cat "$TASK_DEF_FILE" | grep -E "executionRoleArn|taskRoleArn" || true
            exit 0
          fi
          
          # Register task definition (retry up to 3 times)
          TASK_DEF_ARN=""
          for i in 1 2 3; do
            echo "Attempt $i: Registering task definition..."
            REGISTER_OUTPUT=$(aws ecs register-task-definition \
              --cli-input-json file://"$TASK_DEF_FILE" \
              --region $AWS_REGION 2>&1) || REGISTER_ERROR="$REGISTER_OUTPUT"
            
            if [ $? -eq 0 ]; then
              # Extract task definition ARN from output
              TASK_DEF_ARN=$(echo "$REGISTER_OUTPUT" | grep -oE 'arn:aws:ecs:[^"]+task-definition/[^"]+' | head -1 || echo "")
              if [ -n "$TASK_DEF_ARN" ]; then
                echo "✓ Task definition registered: $TASK_DEF_ARN"
                break
              fi
            else
              echo "⚠️  Registration failed: $REGISTER_ERROR"
              if echo "$REGISTER_ERROR" | grep -q "Role is not valid"; then
                echo "❌ IAM Role ARN is invalid. Check if secrets ECS_TASK_EXECUTION_ROLE_ARN and ECS_TASK_ROLE_ARN are set correctly."
                exit 0  # Don't retry if role is invalid
              fi
            fi
            if [ $i -lt 3 ]; then
              echo "Retrying in $((i * 2)) seconds..."
              sleep $((i * 2))
            fi
          done
          
          if [ -z "$TASK_DEF_ARN" ]; then
            echo "❌ Failed to register task definition after 3 attempts."
            echo "   Error details: $REGISTER_ERROR"
            echo "   Cannot create service without task definition."
            exit 0
          fi
          
          # Get VPC and subnets for service creation
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=is-default,Values=true" --region $AWS_REGION --query 'Vpcs[0].VpcId' --output text)
          SUBNET_IDS=($(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" --region $AWS_REGION --query 'Subnets[*].SubnetId' --output text))
          SUBNET_1=${SUBNET_IDS[0]}
          SUBNET_2=${SUBNET_IDS[1]}
          
          # Get frontend security group
          FRONTEND_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=syncflow-frontend-task-sg" "Name=vpc-id,Values=$VPC_ID" \
            --region $AWS_REGION \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$FRONTEND_SG_ID" ] || [ "$FRONTEND_SG_ID" == "None" ]; then
            echo "⚠️  Frontend security group not found. Service creation may fail."
            echo "   Run: cd ecs && AWS_REGION=$AWS_REGION ./create-ecs-services.sh"
            exit 0
          fi
          
          # Create service
          if aws ecs create-service \
            --cluster "$CLUSTER" \
            --service-name "$SERVICE_NAME" \
            --task-definition "$TASK_DEF_ARN" \
            --desired-count 1 \
            --launch-type FARGATE \
            --platform-version LATEST \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_1,$SUBNET_2],securityGroups=[$FRONTEND_SG_ID],assignPublicIp=ENABLED}" \
            --health-check-grace-period-seconds 60 \
            --region $AWS_REGION 2>&1; then
            echo "✓ Frontend service created: $SERVICE_NAME"
          else
            echo "⚠️  Failed to create service (may already exist or need manual creation)"
          fi

